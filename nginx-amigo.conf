# ============================================================
# Amigo Nginx 反向代理配置
# 用法: 复制到 /etc/nginx/conf.d/amigo.conf  然后 nginx -s reload
# ============================================================
# 功能：
#   /          → Hugo 静态站点 + Express 兜底
#   /admin/*   → Vue 管理后台 (Express 内置托管)
#   /api/*     → Express REST API
# ============================================================

upstream amigo_backend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name your-domain.com;   # 改成你的域名

    charset utf-8;
    client_max_body_size 200M;     # 上传限制

    # 管理后台 + API 全部转发给 Express
    location / {
        proxy_pass http://amigo_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 256;
}
